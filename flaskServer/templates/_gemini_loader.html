<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<div class="modal fade" id="geminiLoaderModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-body text-center py-4">
                <div class="spinner-border text-success" role="status" aria-label="Loading">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 mb-0">Loading information...</p>
            </div>
        </div>
    </div>
</div>

<script>
    function showGeminiLoader() {
        const el = document.getElementById("geminiLoaderModal");
        if (!el || !window.bootstrap) {
            return;
        }
        bootstrap.Modal.getOrCreateInstance(el).show();
    }

    document.querySelectorAll("form").forEach((form) => {
        form.addEventListener("submit", (event) => {
            if (event.defaultPrevented) {
                return;
            }
            showGeminiLoader();
        });
    });
</script>
