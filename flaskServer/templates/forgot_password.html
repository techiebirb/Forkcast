{% extends "base.html" %}
{% block title %}Forgot password · Forkcast{% endblock %}

{% block body %}
<main class="fw-auth">
    <p class="fw-wordmark">Forkcast</p>

    <div class="fw-auth__head">
        <h1 class="fw-display">Forgot password</h1>
        <p class="fw-body fw-muted">Enter your username or email and we'll send a code to the email on the account.</p>
    </div>

    <form class="fw-auth__form" method="post" action="{{ url_for('api_password_forgot') }}" aria-label="Forgot password">
        {% if error %}
        <div class="fw-alert" role="alert">
            <i class="ph ph-warning" style="font-size: 20px" aria-hidden="true"></i>
            <p><strong>{{ error }}</strong></p>
        </div>
        {% endif %}

        <div class="fw-field">
            <label for="fp-id">Username or email</label>
            <div class="fa-input">
                <input id="fp-id" type="text" name="identifier" autocomplete="username" required autofocus>
            </div>
        </div>

        <button class="fc-btn fc-btn--primary fc-btn--lg fc-btn--block" type="submit" style="margin-top: 8px;">
            <span class="fc-btn__label">Send code</span>
        </button>
    </form>

    <p class="fw-auth__foot"><a href="{{ url_for('login_page') }}">Back to log in</a></p>
</main>
{% endblock %}
