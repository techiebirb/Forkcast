<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="page">
        <h1>Log in</h1>
        <p class="lede">Sign in with your username and password to use the app.</p>

        {% if error %}
        <div class="banner error">{{ error }}</div>
        {% endif %}

        <form class="card auth-form" method="post" action="{{ url_for('api_login') }}">
            {% if next_url %}
            <input type="hidden" name="next" value="{{ next_url }}">
            {% endif %}
            <label class="stack">Username
                <input type="text" name="username" autocomplete="username" required>
            </label>
            <label class="stack">Password
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <div class="actions">
                <button class="primary" type="submit">Log in</button>
            </div>
        </form>
        <p>Need an account? <a href="{{ url_for('signup_page') }}">Sign up</a></p>
    </main>
</body>
</html>
