<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="page">
        <h1>Sign up</h1>
        <p class="lede">Create a username and password. You will be signed in after signing up.</p>

        {% if error %}
        <div class="banner error">{{ error }}</div>
        {% endif %}

        <form class="card auth-form" method="post" action="{{ url_for('api_signup') }}">
            <label class="stack">Username
                <input type="text" name="username" autocomplete="username" required minlength="3">
            </label>
            <label class="stack">Password
                <input type="password" name="password" autocomplete="new-password" required minlength="4">
            </label>
            <div class="actions">
                <button class="primary" type="submit">Create account</button>
            </div>
        </form>
        <p>Already have an account? <a href="{{ url_for('login_page') }}">Log in</a></p>
    </main>
</body>
</html>
