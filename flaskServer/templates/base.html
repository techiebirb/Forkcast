<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}Forkcast{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='phosphor.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='forkcast.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='forkcast-web.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="fw-page" data-loading-target>
        {% block body %}{% endblock %}
    </div>
    <script src="{{ url_for('static', filename='loading.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
